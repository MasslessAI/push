name: 💡 Feature request
description: Suggest an idea or improvement for Push.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it. Others can 👍 your request to help us prioritize.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which app is this for?
      options:
        - macOS
        - iOS
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and where does Push get in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind.
    validations:
      required: false
